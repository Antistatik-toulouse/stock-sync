name: Sync Stock Imbretex → Shopify

on:
  schedule:
    - cron: '30 6,10,14,18 * * *'  # 8h30, 12h30, 16h30, 20h30 (heure Paris été)
  workflow_dispatch:                 # Déclenchement manuel possible

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm install

      - name: Sync stocks Imbretex → Shopify
        run: node sync-imbretex.mjs
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          IMBRE_CLIENT_ID: ${{ secrets.IMBRE_CLIENT_ID }}
          IMBRE_CLIENT_SECRET: ${{ secrets.IMBRE_CLIENT_SECRET }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
